name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64

      - name: Build
        run: make

      - name: Validate artifact
        run: make check

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: version.dll-x64-bandizip-7.4.6
          path: dist/version.dll
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          version.dll for Bandizip 7.4.6 (Bandizip.exe 7.46.0.1, BuildNo 71822, x86-64).

          Install: copy version.dll next to Bandizip.exe.

          It is a proxy for the system version.dll that runs in-process before the
          EXE entry point and redirects the edition decision inside Bandizip.exe:
          the "not registered" path stores edition 980 (Professional) and the
          edition string "PRO" instead of 152 (Standard) / "STD". Every other
          build is left untouched, where the DLL is a transparent pass-through.

          Diagnostics: set BZPATCH_LOG=%TEMP%\bzpatch.log before starting
          Bandizip.exe; the log reports the patch result and the edition the
          application ended up with.
          EOF
          printf '\nArtifact: version.dll - sha256 %s\n' \
            "$(sha256sum dist/version.dll | cut -d' ' -f1)" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/version.dll \
            --title "version.dll - Bandizip 7.4.6 edition patch $GITHUB_REF_NAME" \
            --notes-file notes.md
